<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Asistencia</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Hola, <span id="nombre-usuario"></span></h1>
    <button id="btn-logout">Cerrar sesión</button>
</header>
<main>
    <div class="card">
        <h2>Registrar asistencia</h2>
        <div class="actions">
            <button id="btn-entrada" class="btn-primary">Marcar entrada</button>
            <button id="btn-salida" class="btn-primary">Marcar salida</button>
        </div>
        <p id="msg" class="msg"></p>
    </div>

    <div class="card">
        <h2>Mi historial</h2>
        <table id="tabla-historial">
            <thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</main>
<script src="/js/core.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
