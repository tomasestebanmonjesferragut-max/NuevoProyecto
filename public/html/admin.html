<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administración — Asistencia</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header>
    <h1>Panel de administración — <span id="nombre-usuario"></span></h1>
    <button id="btn-logout">Cerrar sesión</button>
</header>
<main>
    <div class="tabs">
        <button class="active" data-panel="panel-usuarios">Usuarios</button>
        <button data-panel="panel-reportes">Reportes</button>
    </div>

    <section id="panel-usuarios" class="panel">
        <div class="card">
            <h2 id="titulo-form">Nuevo usuario</h2>
            <form id="form-usuario">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" required>

                <label for="password">Contraseña (dejar en blanco para no cambiarla)</label>
                <input type="password" id="password">

                <label for="rol">Rol</label>
                <select id="rol">
                    <option value="empleado">Empleado</option>
                    <option value="admin">Administrador</option>
                </select>

                <label for="estado">Estado</label>
                <select id="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>

                <div class="actions">
                    <button type="submit" class="btn-primary">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn-secondary">Cancelar</button>
                </div>
                <p id="msg-usuarios" class="msg"></p>
            </form>
        </div>

        <div class="card">
            <h2>Usuarios registrados</h2>
            <table id="tabla-usuarios">
                <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>

    <section id="panel-reportes" class="panel hidden">
        <div class="card">
            <h2>Reportes</h2>
            <div class="actions">
                <button id="btn-atrasos" class="btn-secondary">Atrasos</button>
                <button id="btn-salidas" class="btn-secondary">Salidas anticipadas</button>
            </div>
            <div class="actions">
                <input type="date" id="fecha-inasistencias">
                <button id="btn-inasistencias" class="btn-secondary">Inasistencias</button>
            </div>
            <table id="tabla-reporte">
                <thead><tr></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </section>
</main>
<script src="/js/core.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
